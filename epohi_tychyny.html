<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відлуння кларнетів ( зістав "епохи" Тичини...)</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for game aesthetics and responsiveness */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align to top for better content flow */
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .game-container {
            background-color: #ffffff;
            border-radius: 15px; /* Rounded corners for the main container */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Soft shadow for depth */
            padding: 30px;
            max-width: 1000px; /* Max width for readability */
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .elements-pool {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #f9fafb;
        }
        .eras-grid {
            background-color: #e0f2fe; /* Light blue for era areas */
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* Responsive grid for two columns */
            gap: 20px;
            width: 100%;
        }
        .era-card {
            background-color: #bbdefb; /* Slightly darker blue */
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            font-weight: 600;
            color: #1a237e; /* Dark blue text */
            min-height: 250px; /* Ensure drop target is visible and has space */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Align content to top */
            gap: 10px;
            border: 2px solid transparent; /* For feedback border */
        }
        .drop-zone {
            min-height: 150px; /* Area for dropped elements */
            border: 2px dashed #90a4ae; /* blue-grey */
            border-radius: 8px;
            width: 95%;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            margin-top: 15px;
        }
        .drop-zone.hovered {
            background-color: #e8f5e9; /* light green */
            border-color: #66bb6a; /* green */
        }
        .poetic-element {
            background-color: #fff3e0; /* light orange */
            border-radius: 8px;
            padding: 10px 15px;
            margin: 5px;
            border: 1px solid #ffcc80;
            cursor: grab;
            font-size: 0.95rem;
            font-weight: 500;
            color: #e65100; /* dark orange */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, opacity 0.2s ease;
            text-align: center;
        }
        .poetic-element:active {
            cursor: grabbing;
            transform: scale(1.05);
        }
        .poetic-element.dragging {
            opacity: 0.6;
        }
        .check-button, .reset-button {
            background-color: #4f46e5; /* indigo-600 */
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 1.125rem; /* text-lg */
            font-weight: 700; /* font-bold */
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }
        .check-button:hover, .reset-button:hover {
            background-color: #4338ca; /* indigo-700 */
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4);
        }
        .reset-button {
            background-color: #ef4444; /* red-500 */
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }
        .reset-button:hover {
            background-color: #dc2626; /* red-600 */
        }
        .results-summary {
            margin-top: 30px;
            padding: 20px;
            background-color: #e0f2fe; /* light blue */
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            color: #0c4a6e;
            border: 1px solid #90cdf4;
            display: none; /* Hidden by default */
        }
        .era-card.correct-feedback {
            border-color: #34d399; /* green-400 */
            background-color: #e8f5e9; /* light green */
        }
        .era-card.incorrect-feedback {
            border-color: #ef4444; /* red-500 */
            background-color: #ffebee; /* light red */
        }
        .poetic-element.correct {
            background-color: #a7f3d0; /* green-200 */
            border-color: #34d399; /* green-400 */
        }
        .poetic-element.incorrect {
            background-color: #fecaca; /* red-200 */
            border-color: #ef4444; /* red-500 */
        }
        .correct-answer-hint {
            font-size: 0.85rem;
            color: #16a34a;
            margin-top: 5px;
            display: none; /* Hidden by default */
        }
        .poetic-element.incorrect + .correct-answer-hint {
            display: block; /* Show hint if element is incorrect */
        }
        .hidden-item {
            display: none !important;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
            }
            .elements-pool, .eras-grid {
                padding: 15px;
            }
            .era-card {
                min-height: 200px;
            }
            .poetic-element {
                font-size: 0.85rem;
                padding: 8px 12px;
            }
            .check-button, .reset-button {
                font-size: 1rem;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="text-3xl md:text-4xl font-bold text-center mb-8 text-gray-800">Відлуння кларнетів ( зістав "епохи" Тичини...)</h1>
        <p class="text-center text-gray-600 mb-6">Перетягніть описи поетичних рис до відповідних періодів творчості Павла Тичини.</p>

        <div id="elements-pool" class="elements-pool">
            <h2 class="text-xl font-semibold text-gray-700 w-full text-center mb-4">Риси поезії:</h2>
            <div class="flex flex-wrap justify-center gap-4" id="draggable-elements">
                <!-- Draggable elements will be loaded here by JavaScript -->
            </div>
        </div>

        <div id="eras-grid" class="eras-grid">
            <!-- Era drop zones will be loaded here by JavaScript -->
        </div>

        <div class="flex flex-col md:flex-row gap-4 w-full mt-8">
            <button id="check-answers-btn" class="check-button">Перевірити відповіді</button>
            <button id="reset-game-btn" class="reset-button">Скинути гру</button>
        </div>

        <div id="game-results" class="results-summary">
            <!-- Results will be displayed here -->
        </div>
    </div>

    <script>
        // Data for eras and their correct poetic elements
        const gameData = [
            {
                era: "Ранній Тичина ('Сонячні кларнети')",
                elements: [
                    "Музикальність, синестезія, світлі образи",
                    "Оспівування природи, кохання, гармонії",
                    "Вільний політ думки, експерименти з формою",
                    "Оптимізм, віра в красу світу",
                    "Використання народнопоетичних мотивів",
                    "Символізм, імпресіонізм"
                ]
            },
            {
                era: "Пізній Тичина (пригнічена муза)", // Updated title here
                elements: [
                    "Ідеологічні гасла, оспівування партії",
                    "Втрата індивідуальності, пристосуванство",
                    "Сухий, декларативний стиль",
                    "Трагізм світовідчуття, біль душі",
                    "Примусовий оптимізм",
                    "Соціалістичний реалізм"
                ]
            }
        ];

        let allElements = [];
        gameData.forEach(item => {
            item.elements.forEach(elementText => {
                allElements.push({ text: elementText, era: item.era });
            });
        });

        // Shuffle elements for random placement in the pool
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        shuffleArray(allElements);

        const draggableElementsContainer = document.getElementById('draggable-elements');
        const erasGrid = document.getElementById('eras-grid');
        const checkAnswersBtn = document.getElementById('check-answers-btn');
        const resetGameBtn = document.getElementById('reset-game-btn');
        const gameResultsDiv = document.getElementById('game-results');

        // Function to render the game
        function renderGame() {
            draggableElementsContainer.innerHTML = '';
            erasGrid.innerHTML = '';
            gameResultsDiv.classList.add('hidden');
            gameResultsDiv.textContent = '';

            // Render draggable elements
            allElements.forEach((element, index) => {
                const elementItem = document.createElement('div');
                elementItem.className = 'poetic-element';
                elementItem.textContent = element.text;
                elementItem.setAttribute('draggable', true);
                elementItem.dataset.originalEra = element.era; // Store correct era
                elementItem.id = `element-${index}`; // Unique ID for dataTransfer
                draggableElementsContainer.appendChild(elementItem);

                elementItem.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', e.target.id);
                    setTimeout(() => {
                        e.target.classList.add('dragging');
                    }, 0);
                });

                elementItem.addEventListener('dragend', (e) => {
                    e.target.classList.remove('dragging');
                });
            });

            // Render era drop zones
            gameData.forEach((eraData) => {
                const eraCard = document.createElement('div');
                eraCard.className = 'era-card';
                eraCard.innerHTML = `
                    <h3 class="text-xl font-bold">${eraData.era}</h3>
                    <div class="drop-zone" data-era="${eraData.era}"></div>
                `;
                erasGrid.appendChild(eraCard);

                const dropZone = eraCard.querySelector('.drop-zone');

                dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault(); // Allow drop
                    dropZone.classList.add('hovered');
                });

                dropZone.addEventListener('dragleave', () => {
                    dropZone.classList.remove('hovered');
                });

                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('hovered');
                    const data = e.dataTransfer.getData('text/plain');
                    const draggedItem = document.getElementById(data);

                    if (draggedItem) {
                        // Check if the item is already in a drop zone (to prevent duplicates if re-dropping)
                        if (draggedItem.parentNode && draggedItem.parentNode.classList.contains('drop-zone')) {
                            // If it's being moved from one drop zone to another, remove from previous
                            draggedItem.parentNode.removeChild(draggedItem);
                        } else if (draggedItem.parentNode === draggableElementsContainer) {
                            // If moving from initial pool, remove it visually from there
                            draggedItem.classList.add('hidden-item'); // Temporarily hide from pool
                        }
                        dropZone.appendChild(draggedItem);
                        draggedItem.classList.remove('correct', 'incorrect', 'hidden-item'); // Clear previous feedback and unhide
                    }
                });
            });
        }

        // Function to check answers
        function checkAnswers() {
            let correctCount = 0;
            let totalElements = allElements.length;

            // Clear previous feedback
            document.querySelectorAll('.poetic-element').forEach(item => {
                item.classList.remove('correct', 'incorrect');
                const hint = item.nextElementSibling;
                if (hint && hint.classList.contains('correct-answer-hint')) {
                    hint.remove(); // Remove existing hints
                }
            });
            document.querySelectorAll('.era-card').forEach(card => {
                card.classList.remove('correct-feedback', 'incorrect-feedback');
            });

            gameData.forEach(eraData => {
                const dropZone = document.querySelector(`.drop-zone[data-era="${eraData.era}"]`);
                const eraCard = dropZone.closest('.era-card');
                const droppedElements = Array.from(dropZone.children);
                let eraCardCorrect = true; // Flag for era card feedback

                // Collect correct elements for this era to check if all are present
                const correctElementsForEra = new Set(eraData.elements);
                let foundCorrectElements = new Set(); // To track which correct elements have been dropped

                droppedElements.forEach(elementItem => {
                    const originalEra = elementItem.dataset.originalEra;
                    if (originalEra === eraData.era) {
                        elementItem.classList.add('correct');
                        correctCount++;
                        foundCorrectElements.add(elementItem.textContent);
                    } else {
                        elementItem.classList.add('incorrect');
                        eraCardCorrect = false;
                        // Add hint for incorrect placement
                        let hint = document.createElement('p');
                        hint.className = 'correct-answer-hint';
                        hint.textContent = `Правильно: ${originalEra}`;
                        elementItem.parentNode.insertBefore(hint, elementItem.nextSibling); // Insert after the element item
                        hint.classList.remove('hidden');
                    }
                });

                // Check if all *expected* elements for this era are in the drop zone
                const allExpectedElementsPresent = eraData.elements.every(expectedElement =>
                    foundCorrectElements.has(expectedElement)
                );

                // If any incorrect elements were dropped OR not all expected elements were dropped
                if (!allExpectedElementsPresent || droppedElements.some(item => item.dataset.originalEra !== eraData.era)) {
                    eraCardCorrect = false;
                }

                if (eraCardCorrect) {
                    eraCard.classList.add('correct-feedback');
                } else {
                    eraCard.classList.add('incorrect-feedback');
                }
            });

            gameResultsDiv.textContent = `Ви правильно зіставили ${correctCount} з ${totalElements} елементів!`;
            gameResultsDiv.classList.remove('hidden');
        }

        // Event listeners
        checkAnswersBtn.addEventListener('click', checkAnswers);
        resetGameBtn.addEventListener('click', renderGame); // Simply re-render the game to reset

        // Initial render
        window.onload = renderGame;
    </script>
</body>
</html>
