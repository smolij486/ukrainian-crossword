<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жіночі образи 'Землі'</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for gallery aesthetics and responsiveness */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align to top for better content flow */
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .gallery-container {
            background-color: #ffffff;
            border-radius: 15px; /* Rounded corners for the main container */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Soft shadow for depth */
            padding: 30px;
            max-width: 1000px; /* Max width for readability */
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Responsive grid */
            gap: 25px;
            width: 100%;
            justify-content: center;
        }
        .character-card {
            background-color: #e0f2fe; /* Light blue for cards */
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden; /* Hide overflow for rounded corners */
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 20px; /* Padding for text below image */
            min-height: 380px; /* Fixed height for consistency */
        }
        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .character-image {
            width: 100%;
            height: 200px; /* Fixed height for images */
            object-fit: cover; /* Ensures image covers the area */
            border-bottom: 1px solid #bfdbfe; /* Light border below image */
        }
        .character-name {
            font-size: 1.5rem; /* text-2xl */
            font-weight: 700; /* font-bold */
            color: #1a237e; /* Dark blue text */
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .character-details {
            font-size: 0.95rem; /* text-base */
            color: #4b5563; /* Gray text */
            line-height: 1.5;
            padding: 0 15px;
            display: none; /* Hidden by default, shown on click */
        }
        .character-card.active .character-details {
            display: block; /* Show details when card is active */
        }
        .character-card.active .character-image {
            height: 150px; /* Shrink image when details are shown */
        }
        .read-more-btn {
            background-color: #4f46e5;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 15px;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease;
        }
        .read-more-btn:hover {
            background-color: #4338ca;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 640px) {
            .gallery-container {
                padding: 20px;
            }
            .gallery-grid {
                grid-template-columns: 1fr; /* Single column on small screens */
            }
            .character-card {
                min-height: auto; /* Allow height to adjust on small screens */
                padding-bottom: 15px;
            }
            .character-image {
                height: 180px;
            }
            .character-name {
                font-size: 1.25rem;
            }
            .character-details {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <h1 class="text-3xl md:text-4xl font-bold text-center mb-8 text-gray-800">Жіночі образи у повісті "Земля"</h1>
        <p class="text-center text-gray-600 mb-6">Натисніть на картку, щоб дізнатися більше про кожну героїню та її роль у боротьбі за гідність.</p>

        <div id="gallery-grid" class="gallery-grid">
            <!-- Character cards will be dynamically inserted here by JavaScript -->
        </div>
    </div>

    <script>
        // Data for female characters with their images, descriptions, and quotes
        const charactersData = [
            {
                name: "Марійка Федорчук",
                image: "https://placehold.co/400x200/bbdefb/1a237e?text=Марійка",
                description: "Марійка - дружина Івоніки, мати Михайла та Сави. Вона є втіленням традиційної селянки, працьовитої та відданої землі. Її життя сповнене важкої праці та турбот про родину. Після трагедії з синами її душа зазнає невимовних страждань, і вона усвідомлює власну провину.",
                quote: "Сама в цьому винна! Сама-самісінька вона!"
            },
            {
                name: "Анна",
                image: "https://placehold.co/400x200/c8e6c9/1b5e20?text=Анна",
                description: "Анна - кохана Михайла, наймичка. Вона є символом чистоти, ніжності та внутрішньої сили. Попри бідність та приниження, вона зберігає свою гідність і бореться за право на щастя та за своїх дітей. Її образ підкреслює тему жіночої емансипації.",
                quote: "Я не хочу, щоб мене люди обзивали ледащицею."
            },
            {
                name: "Рахіра",
                image: "https://placehold.co/400x200/fecaca/dc2626?text=Рахіра",
                description: "Рахіра - двоюрідна сестра Михайла і Сави, кохана Сави. Вона є антиподом Анни, втіленням прагматизму, матеріалізму та грубості. Її образ показує, як жадібність до землі може спотворити людську душу і штовхнути на злочин.",
                quote: "Вона погана волошка, циганка. Дивися на її зуби й на її рот!"
            }
            // Add more female characters if desired
        ];

        const galleryGrid = document.getElementById('gallery-grid');

        // Function to create and append character cards
        function createCharacterCard(data) {
            const card = document.createElement('div');
            card.className = 'character-card';

            const image = document.createElement('img');
            image.className = 'character-image';
            image.src = data.image;
            image.alt = `Портрет ${data.name}`;
            card.appendChild(image);

            const name = document.createElement('h2');
            name.className = 'character-name';
            name.textContent = data.name;
            card.appendChild(name);

            const details = document.createElement('div');
            details.className = 'character-details';
            details.innerHTML = `
                <p><strong>Опис:</strong> ${data.description}</p>
                <p class="mt-3"><strong>Цитата:</strong> <em>"${data.quote}"</em></p>
            `;
            card.appendChild(details);

            // Toggle active class on click
            card.addEventListener('click', () => {
                card.classList.toggle('active');
            });

            return card;
        }

        // Render all character cards on page load
        window.onload = () => {
            charactersData.forEach(data => {
                galleryGrid.appendChild(createCharacterCard(data));
            });
        };
    </script>
</body>
</html>
