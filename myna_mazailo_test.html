<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Літературний тест: Мина Мазайло</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for overall aesthetics and responsiveness */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align to top for better content flow */
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            border-radius: 15px; /* Rounded corners for the main container */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Soft shadow for depth */
            padding: 30px;
            max-width: 900px; /* Max width for readability */
            width: 100%;
            margin-top: 20px;
        }
        h1 {
            font-size: 2.5rem; /* text-4xl equivalent */
            font-weight: 700; /* font-bold */
            text-align: center;
            margin-bottom: 20px;
            color: #374151; /* Dark gray text */
        }
        h2 {
            font-size: 1.75rem; /* text-3xl equivalent */
            font-weight: 600; /* font-semibold */
            text-align: center;
            margin-bottom: 30px;
            color: #4f46e5; /* Indigo-600 */
        }
        .question-block {
            margin-bottom: 25px;
            padding: 20px;
            background-color: #f9fafb; /* Lightest gray for question blocks */
            border-radius: 10px;
            border: 1px solid #e5e7eb; /* Light border */
        }
        .question-text {
            font-size: 1.15rem; /* text-lg equivalent */
            font-weight: 500; /* font-medium */
            margin-bottom: 15px;
            color: #1f2937; /* Darker gray text */
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .option-label:hover {
            background-color: #eff6ff; /* Blue-50 on hover */
            border-color: #93c5fd; /* Blue-300 on hover */
        }
        .option-input[type="radio"] {
            margin-right: 10px;
            accent-color: #4f46e5; /* Indigo-600 for radio button */
            transform: scale(1.2); /* Slightly larger radio button */
        }
        .feedback-text {
            margin-top: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            display: none; /* Hidden by default */
        }
        .feedback-text.correct {
            color: #10b981; /* Emerald-500 */
        }
        .feedback-text.incorrect {
            color: #ef4444; /* Red-500 */
        }
        .correct-answer-text {
            margin-top: 5px;
            font-size: 0.9rem;
            color: #6b7280; /* Gray-500 */
            display: none; /* Hidden by default */
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .action-button {
            background-color: #4f46e5; /* Indigo-600 */
            color: white;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }
        .action-button:hover {
            background-color: #4338ca; /* Darker indigo on hover */
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4);
        }
        .action-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.2);
        }
        .action-button.reset {
            background-color: #ef4444; /* Red-500 */
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }
        .action-button.reset:hover {
            background-color: #dc2626; /* Darker red on hover */
            box-shadow: 0 6px 15px rgba(239, 68, 68, 0.4);
        }
        .results-summary {
            margin-top: 30px;
            padding: 20px;
            background-color: #e0f2fe; /* Light blue for results */
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2563eb; /* Blue-700 */
            display: none; /* Hidden by default */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 640px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 2rem;
            }
            h2 {
                font-size: 1.5rem;
            }
            .question-text {
                font-size: 1rem;
            }
            .option-label {
                padding: 8px 12px;
                font-size: 0.95rem;
            }
            .action-button {
                padding: 12px 20px;
                font-size: 1rem;
            }
            .button-group {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Микола Куліш. “Мина Мазайло”</h1>
        <h2>Літературний тест</h2>

        <form id="test-form">
            <!-- Questions will be dynamically inserted here -->
        </form>

        <div class="button-group">
            <button type="button" id="check-answers-btn" class="action-button">Перевірити відповіді</button>
            <button type="button" id="reset-btn" class="action-button reset">Скинути</button>
        </div>

        <div id="results-summary" class="results-summary">
            <!-- Results summary will be displayed here -->
        </div>
    </div>

    <script>
        // Array of questions with correct answers and distractors for multiple choice
        const questions = [
            {
                question: "У кого з героїв і “кури по-українському говорять” ?",
                options: ["У дядька Тараса.", "У Мини Мазайла.", "У Мокія.", "У тьоті Моті."],
                correctAnswer: "У дядька Тараса."
            },
            {
                question: "Що означає слово бразолійний?",
                options: ["Яскраво-червоний.", "Темно-синій.", "Блискучий.", "Старовинний."],
                correctAnswer: "Темно-синій."
            },
            {
                question: "Яке завдання Рина поставила перед Улею?",
                options: ["Допомогти Мокію вивчити російську.", "Закохати Мокія в себе, щоб відволікти від української мови.", "Переконати Мокія змінити прізвище.", "Поїхати з Мокієм до Одеси."],
                correctAnswer: "Закохати Мокія в себе, щоб відволікти від української мови."
            },
            {
                question: "Завершіть репліку Мокія : “ Улю! Давайте я вас ... ! ”",
                options: ["любитиму", "навчу", "українізую", "одружу"],
                correctAnswer: "українізую"
            },
            {
                question: "У кого з героїв “український індекс” ?",
                options: ["У Мини.", "У Рини.", "В Улі.", "У Мокія."],
                correctAnswer: "В Улі."
            },
            {
                question: "Про що мова: “ ... Моє лихо віковічне. Прокляття, якесь каїнове тавро, що по ньому мене впізнаватимуть навіть тоді, коли я возговорю не те що чистою руською, а небесною, ангельською мовою».",
                options: ["Про прізвище Мазайло.", "Про українську мову.", "Про слово 'Ге'.", "Про Харків."],
                correctAnswer: "Про слово 'Ге'."
            },
            {
                question: "Яке слово, вимовлене Улею, засвідчило, що вона скоро навчиться мови?",
                options: ["Борщ.", "Вареники.", "Паляниця.", "Кобзар."],
                correctAnswer: "Паляниця."
            },
            {
                question: "У кого з героїв твору “рафінована руська вимова” ?",
                options: ["У Мини Мазайла.", "У тьоті Моті.", "У Бароново-Козино.", "У Мокія."],
                correctAnswer: "У Бароново-Козино."
            },
            {
                question: "Як, за словами тьоті Моті, “іспортілі город” Харків?",
                options: ["Побудували нові будинки.", "На вокзалі написали не “Харьков”, а “Харків”.", "Змінили назви вулиць.", "Заборонили розмовляти російською."],
                correctAnswer: "На вокзалі написали не “Харьков”, а “Харків”."
            },
            {
                question: "Що тьотя Мотя називає “австріяцькою видумкою” ?",
                options: ["Борщ.", "Вишиванку.", "Українську мову.", "Шаровари."],
                correctAnswer: "Українську мову."
            },
            {
                question: "Завершіть репліку: “...Прилічніше бути ізнасілованной, нєжелі ...”.",
                options: ["...заміжньою.", "...щасливою.", "...українізірованной.", "...вільною."],
                // Corrected to match the option string exactly, including ellipsis and period
                correctAnswer: "...українізірованной."
            },
            {
                question: "Чому Уля не відповіла Мокію на питання, що йому треба зробити для того, щоб вона не поїхала в Одесу?",
                options: ["Бо вона вже купила квиток.", "Не хотіла маніпулювати ним і використовувати його закоханість.", "Вважала, що це його особиста справа.", "Бо вона не любила його."],
                correctAnswer: "Не хотіла маніпулювати ним і використовувати його закоханість."
            }
        ];

        const form = document.getElementById('test-form');
        const checkAnswersBtn = document.getElementById('check-answers-btn');
        const resetBtn = document.getElementById('reset-btn');
        const resultsSummary = document.getElementById('results-summary');

        /**
         * Renders all questions and multiple-choice options into the form.
         */
        function renderQuestions() {
            form.innerHTML = ''; // Clear previous questions
            questions.forEach((q, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.textContent = `${index + 1}. ${q.question}`;
                questionBlock.appendChild(questionText);

                const optionsContainer = document.createElement('div');
                optionsContainer.classList.add('options-container');

                // Shuffle options to prevent correct answer always being in the same spot
                const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

                shuffledOptions.forEach((option, optionIndex) => {
                    const label = document.createElement('label');
                    label.classList.add('option-label');

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `q${index}`; // Same name for radio group
                    input.value = option;
                    input.classList.add('option-input');
                    label.appendChild(input);

                    const span = document.createElement('span');
                    span.textContent = option;
                    label.appendChild(span);

                    optionsContainer.appendChild(label);
                });

                questionBlock.appendChild(optionsContainer);

                const feedbackText = document.createElement('p');
                feedbackText.classList.add('feedback-text');
                feedbackText.id = `feedback-q${index}`;
                questionBlock.appendChild(feedbackText);

                const correctAnswerText = document.createElement('p');
                correctAnswerText.classList.add('correct-answer-text');
                correctAnswerText.id = `correct-q${index}`;
                correctAnswerText.textContent = `Правильна відповідь: ${q.correctAnswer}`;
                questionBlock.appendChild(correctAnswerText);

                form.appendChild(questionBlock);
            });
        }

        /**
         * Checks all answers, provides feedback, and displays a summary.
         */
        function checkAnswers() {
            let correctCount = 0;
            questions.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                const feedback = document.getElementById(`feedback-q${index}`);
                const correctAnswerDisplay = document.getElementById(`correct-q${index}`);

                // Show correct answer by default for feedback
                correctAnswerDisplay.style.display = 'block';

                if (selectedOption) {
                    // Trim whitespace from both user answer and correct answer for robust comparison
                    const userAnswer = selectedOption.value.trim();
                    const correctAnswer = q.correctAnswer.trim();

                    feedback.style.display = 'block';

                    if (userAnswer === correctAnswer) {
                        feedback.textContent = 'Правильно!';
                        feedback.classList.remove('incorrect');
                        feedback.classList.add('correct');
                        correctCount++;
                    } else {
                        feedback.textContent = 'Неправильно.';
                        feedback.classList.remove('correct');
                        feedback.classList.add('incorrect');
                    }
                } else {
                    feedback.textContent = 'Відповідь не обрано.';
                    feedback.classList.remove('correct');
                    feedback.classList.add('incorrect');
                    feedback.style.display = 'block';
                }
            });

            // Display results summary
            resultsSummary.textContent = `Ви відповіли правильно на ${correctCount} з ${questions.length} питань.`;
            resultsSummary.style.display = 'block';
        }

        /**
         * Resets the form, clears selected answers and feedback.
         */
        function resetTest() {
            questions.forEach((q, index) => {
                const inputs = document.querySelectorAll(`input[name="q${index}"]`);
                inputs.forEach(input => input.checked = false); // Uncheck all radio buttons

                const feedback = document.getElementById(`feedback-q${index}`);
                const correctAnswerDisplay = document.getElementById(`correct-q${index}`);

                feedback.style.display = 'none'; // Hide feedback
                feedback.classList.remove('correct', 'incorrect');
                correctAnswerDisplay.style.display = 'none'; // Hide correct answer
            });
            resultsSummary.style.display = 'none'; // Hide summary
        }

        // Event listeners
        checkAnswersBtn.addEventListener('click', checkAnswers);
        resetBtn.addEventListener('click', resetTest);

        // Initial render when the page loads
        document.addEventListener('DOMContentLoaded', renderQuestions);
    </script>
</body>
</html>
